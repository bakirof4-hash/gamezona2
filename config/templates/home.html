<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>GameZone PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(160deg,#08111f,#10233c,#040810);
    color:white;
    font-family:Arial;
}

/* NAV */
.navbar{
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
}

/* GLASS */
.glass{
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    backdrop-filter:blur(10px);
}

/* GAME CARDS */
.card{
    background:rgba(255,255,255,0.05);
    border:none;
    border-radius:20px;
    transition:0.3s;
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px #00d4ff;
}

/* SECTION */
.section{
    display:none;
}
.active{
    display:block;
}

/* BUTTONS */
.btn-neon{
    background:#00d4ff;
    border:none;
    border-radius:10px;
    color:black;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-3">
    <a class="navbar-brand" href="#">🎮 GameZone</a>

    <div class="ms-auto">
        <button onclick="show('home')" class="btn btn-sm btn-light">Home</button>
        <button onclick="show('games')" class="btn btn-sm btn-light">Games</button>
        <button onclick="window.location.href='/horror/'" class="btn btn-sm btn-light">Leaderboard</button>
        <button onclick="show('login')" class="btn btn-sm btn-light">Login</button>
    </div>
</nav>

<div class="container py-4">

<!-- HOME -->
<div id="home" class="section active">
    <div class="glass text-center">
        <h1>🔥 GameZone PRO</h1>
        <p>Hammasi bitta sahifada</p>
    </div>
</div>

<!-- GAMES -->
<div id="games" class="section">

    <h3>🎮 O'yinlar</h3>

    <div class="row g-3">

        <div class="col-md-3">
            <div class="card p-3">
                <h5>Nebula Rush</h5>
                <button class="btn btn-neon w-100">Play</button>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <h5>Flash Tiles</h5>
                <button class="btn btn-neon w-100">Play</button>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <h5>Lane Escape</h5>
                <button class="btn btn-neon w-100">Play</button>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <h5>Orbit Tap</h5>
                <button class="btn btn-neon w-100">Play</button>
            </div>
        </div>

    </div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="section">

    <div class="glass">
        <h3>🏆 Leaderboard</h3>

        {% for s in top %}
        <div class="d-flex justify-content-between border-bottom p-2">
            <span>{{ s.user.username }}</span>
            <b>{{ s.score }}</b>
        </div>
        {% endfor %}

    </div>

</div>

<!-- LOGIN -->
<div id="login" class="section">

    <div class="glass mx-auto" style="max-width:400px;">
        <h3>🔐 Login</h3>

        <form method="post">
            {% csrf_token %}
            <input class="form-control my-2" name="username" placeholder="Username">
            <input class="form-control my-2" type="password" name="password" placeholder="Password">
            <button class="btn btn-neon w-100">Login</button>
        </form>
    </div>

</div>

</div>

<script>
function show(id){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
