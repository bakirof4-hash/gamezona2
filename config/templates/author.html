<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background:
                radial-gradient(circle at top left, rgba(255, 191, 73, 0.16), transparent 22%),
                radial-gradient(circle at top right, rgba(69, 183, 209, 0.16), transparent 24%),
                linear-gradient(160deg, #08111f, #10233c 58%, #040810);
            color: #f8fbff;
            min-height: 100vh;
        }

        .glass {
            background: rgba(8, 18, 34, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        .hero-title {
            font: 700 clamp(40px, 6vw, 70px)/1 Georgia, serif;
            text-shadow: 0 0 20px rgba(159,220,255,0.4);
        }

        .small-muted {
            color: #a9bfd3;
        }

        .author-card {
            padding: 30px;
        }

        .author-line {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            transition: all .25s ease;
            position: relative;
            overflow: hidden;
        }

        /* NEON HOVER */
        .author-line:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(159,220,255,0.5);
            box-shadow: 0 0 20px rgba(159,220,255,0.25);
        }

        .author-line::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(159,220,255,0.15), transparent);
            opacity: 0;
            transition: 0.4s;
        }

        .author-line:hover::before {
            opacity: 1;
        }

        .author-key {
            color: #9fdcff;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: .12em;
        }

        /* BUTTON GLOW */
        .btn-back {
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .btn-back:hover {
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        /* AVATAR */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: auto;
            background: linear-gradient(135deg, #9fdcff, #ffd166);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: #08111f;
            box-shadow: 0 0 25px rgba(159,220,255,0.4);
        }

    </style>
</head>
<body>

<div class="container py-5">

    <!-- HEADER -->
    <div class="glass p-4 p-md-5 mb-4 text-center">
        <div class="avatar mb-3">U</div>
        <h1 class="hero-title mb-2">Muallif haqida</h1>
        <p class="small-muted">Mualliflar: Umidjon  Ustozim: Dostonaka</p>
    </div>

    <!-- AUTHOR INFO -->
    <div class="glass author-card">
        <div class="d-grid gap-3">

            <div class="author-line">
                <span class="author-key">Ism</span>
                <strong>Umidjon</strong>
            </div>

            <div class="author-line">
                <span class="author-key">Familiya</span>
                <strong>Mamatkosimov</strong>
            </div>

            <div class="author-line">
                <span class="author-key">Yosh</span>
                <strong>14</strong>
            </div>

            <div class="author-line">
                <span class="author-key">Kasb</span>
                <strong>Frontend / Django Developer</strong>
            </div>

        </div>

        <div class="mt-4 text-center">
            <a href="/" class="btn btn-outline-light btn-back px-4">⬅️ Orqaga</a>
        </div>
    </div>

</div>

</body>
</html>
