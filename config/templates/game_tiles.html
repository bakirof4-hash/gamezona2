<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Tiles</title>
    <style>
        :root { --bg:#0f172a; --bg2:#1b2c48; --panel:rgba(12,19,35,.82); --line:rgba(255,255,255,.1); --text:#f8fbff; --muted:#afc2d6; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:18px; color:var(--text); font-family:"Segoe UI",sans-serif; background:radial-gradient(circle at top, rgba(94,234,212,.15), transparent 24%), linear-gradient(160deg, var(--bg), var(--bg2)); }
        .shell { width:min(980px,100%); display:grid; grid-template-columns:1fr 320px; gap:18px; }
        .panel { background:var(--panel); border:1px solid var(--line); border-radius:28px; box-shadow:0 24px 60px rgba(0,0,0,.3); }
        .board { padding:22px; }
        .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:18px; }
        .tile { height:180px; border:0; border-radius:24px; cursor:pointer; transition:transform .12s ease, filter .12s ease, box-shadow .12s ease; }
        .tile:active { transform:scale(.98); }
        .tile.active { filter:brightness(1.35); box-shadow:0 0 0 4px rgba(255,255,255,.14), 0 0 28px currentColor; }
        .t1 { background:#ff6b6b; color:#ff6b6b; }
        .t2 { background:#ffd166; color:#ffd166; }
        .t3 { background:#06d6a0; color:#06d6a0; }
        .t4 { background:#4cc9f0; color:#4cc9f0; }
        .side { padding:22px; display:grid; align-content:start; gap:14px; }
        .lab { color:var(--muted); text-transform:uppercase; letter-spacing:.14em; font-size:12px; }
        h1 { margin:0; font:700 clamp(32px,5vw,58px)/.95 Georgia,serif; }
        .stat { padding:16px; border-radius:18px; border:1px solid var(--line); background:rgba(255,255,255,.03); }
        .num { font-size:34px; font-weight:800; }
        .msg { color:var(--muted); line-height:1.55; }
        .actions { display:grid; gap:10px; }
        .btn { border:0; border-radius:999px; padding:13px 18px; font-weight:800; cursor:pointer; }
        .primary { background:linear-gradient(135deg,#5eead4,#ffd166); color:#07111f; }
        .ghost { color:var(--text); text-decoration:none; text-align:center; background:rgba(255,255,255,.06); border:1px solid var(--line); }
        @media (max-width:860px) { .shell { grid-template-columns:1fr; } .tile { height:140px; } }
    </style>
</head>
<body>
    <div class="shell">
        <section class="panel board">
            <div class="lab">Memory Game</div>
            <h1>Flash Tiles</h1>
            <p class="msg" id="message">Start bosing. Kataklar yonadi, siz shu tartibda qaytarasiz.</p>
            <div class="grid">
                <button class="tile t1" data-tile="0"></button>
                <button class="tile t2" data-tile="1"></button>
                <button class="tile t3" data-tile="2"></button>
                <button class="tile t4" data-tile="3"></button>
            </div>
        </section>
        <aside class="panel side">
            <div class="stat"><div class="lab">Raund</div><div class="num" id="round">0</div></div>
            <div class="stat"><div class="lab">Best</div><div class="num" id="best">0</div></div>
            <div class="stat"><div class="lab">Holat</div><div class="msg" id="status">Kutilyapti</div></div>
            <div class="actions">
                <button class="btn primary" id="startBtn">Start / Restart</button>
                <a class="btn ghost" href="{% url 'home' %}">Asosiy sahifa</a>
                <a class="btn ghost" href="{% url 'game_lanes' %}">Lane Escape</a>
            </div>
        </aside>
    </div>

    <script>
        const tiles = [...document.querySelectorAll(".tile")];
        const messageEl = document.getElementById("message");
        const statusEl = document.getElementById("status");
        const roundEl = document.getElementById("round");
        const bestEl = document.getElementById("best");
        const startBtn = document.getElementById("startBtn");
        const key = "flash-tiles-best";
        let best = Number(localStorage.getItem(key) || 0);
        let sequence = [];
        let userIndex = 0;
        let locked = true;

        bestEl.textContent = best;

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        async function flash(index) {
            const tile = tiles[index];
            tile.classList.add("active");
            await wait(320);
            tile.classList.remove("active");
            await wait(120);
        }

        async function showSequence() {
            locked = true;
            statusEl.textContent = "Eslab qoling";
            for (const index of sequence) {
                await flash(index);
            }
            userIndex = 0;
            locked = false;
            statusEl.textContent = "Sizning navbat";
        }

        async function nextRound() {
            sequence.push(Math.floor(Math.random() * 4));
            roundEl.textContent = sequence.length;
            messageEl.textContent = `Raund ${sequence.length}. Ketma-ketlikni takrorlang.`;
            await wait(350);
            await showSequence();
        }

        async function startGame() {
            sequence = [];
            userIndex = 0;
            locked = true;
            roundEl.textContent = "0";
            messageEl.textContent = "Tayyor bo'ling...";
            statusEl.textContent = "Boshlanmoqda";
            await wait(450);
            await nextRound();
        }

        async function handleTile(index) {
            if (locked) return;
            await flash(index);

            if (sequence[userIndex] !== index) {
                locked = true;
                statusEl.textContent = "Xato";
                messageEl.textContent = `Xato bosildi. Siz ${Math.max(0, sequence.length - 1)} raund o'tdingiz.`;
                if (sequence.length - 1 > best) {
                    best = sequence.length - 1;
                    localStorage.setItem(key, String(best));
                    bestEl.textContent = best;
                }
                return;
            }

            userIndex += 1;
            if (userIndex === sequence.length) {
                locked = true;
                statusEl.textContent = "Zo'r";
                messageEl.textContent = "To'g'ri. Keyingi raund ochilyapti.";
                await wait(500);
                await nextRound();
            }
        }

        tiles.forEach((tile) => {
            tile.addEventListener("click", () => handleTile(Number(tile.dataset.tile)));
        });
        startBtn.addEventListener("click", startGame);
    </script>
</body>
</html>
