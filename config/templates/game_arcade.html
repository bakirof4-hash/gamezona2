<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ game.title }}</title>
    <style>
        :root{
            --accent: {{ game.accent }};
            --bg:#060f19;
            --bg2:#10233a;
            --panel:rgba(6,15,25,.78);
            --line:rgba(255,255,255,.08);
            --text:#f4fbff;
            --muted:#a9bfd4;
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            min-height:100vh;
            padding:16px;
            display:grid;
            place-items:center;
            color:var(--text);
            font-family:"Segoe UI",sans-serif;
            background-color:#07111d;
            background:
                radial-gradient(circle at 10% 10%, rgba(255,255,255,.08), transparent 18%),
                radial-gradient(circle at 90% 0%, rgba(255,255,255,.09), transparent 18%),
                linear-gradient(160deg,var(--bg),var(--bg2) 60%, #03070d);
        }
        .shell{
            width:min(1520px,100%);
            display:grid;
            grid-template-columns:minmax(0,1.45fr) 360px;
            gap:18px;
        }
        .panel{
            background:var(--panel);
            border:1px solid var(--line);
            border-radius:30px;
            backdrop-filter:blur(16px);
            box-shadow:0 28px 80px rgba(0,0,0,.3);
        }
        .stage{padding:18px}
        .hud{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:10px;
            margin-bottom:12px;
        }
        .stat{
            padding:14px 16px;
            border-radius:18px;
            border:1px solid var(--line);
            background:rgba(255,255,255,.04);
        }
        .lab{
            display:block;
            margin-bottom:8px;
            font-size:11px;
            letter-spacing:.16em;
            text-transform:uppercase;
            color:var(--muted);
        }
        .val{
            font-size:30px;
            font-weight:800;
        }
        canvas{
            display:block;
            width:100%;
            height:auto;
            aspect-ratio:16/9;
            border-radius:24px;
            border:1px solid var(--line);
            background:linear-gradient(180deg,#09131f,#03070d);
        }
        .mobile-controls{
            display:none;
            grid-template-columns:minmax(0,170px) minmax(0,1fr);
            gap:12px;
            margin-top:12px;
            align-items:end;
        }
        .stick{
            position:relative;
            width:154px;
            height:154px;
            border-radius:50%;
            border:1px solid rgba(255,255,255,.12);
            background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.03));
            touch-action:none;
        }
        .knob{
            position:absolute;
            left:50%;
            top:50%;
            width:64px;
            height:64px;
            border-radius:50%;
            transform:translate(-50%,-50%);
            background:linear-gradient(135deg,var(--accent),#ffd36e);
            box-shadow:0 12px 28px rgba(0,0,0,.35);
        }
        .mobile-actions{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:10px;
        }
        .side{
            padding:24px;
            display:grid;
            gap:16px;
            align-content:start;
        }
        .tag{
            display:inline-flex;
            align-items:center;
            gap:10px;
            padding:8px 12px;
            border-radius:999px;
            background:rgba(255,255,255,.06);
            color:var(--accent);
            font-size:12px;
            letter-spacing:.16em;
            text-transform:uppercase;
        }
        h1{
            margin:0;
            font:700 clamp(36px,5vw,68px)/.94 Georgia,serif;
        }
        p{margin:0;color:var(--muted);line-height:1.6}
        .box{
            padding:16px;
            border-radius:20px;
            border:1px solid var(--line);
            background:rgba(255,255,255,.04);
        }
        .box strong{display:block;margin-bottom:8px}
        .actions{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:10px;
        }
        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:13px 18px;
            border-radius:999px;
            border:1px solid rgba(255,255,255,.12);
            font-weight:800;
            text-decoration:none;
            cursor:pointer;
        }
        .pri{
            color:#07111f;
            background:linear-gradient(135deg,var(--accent),#ffd36e);
        }
        .ghost{
            color:var(--text);
            background:rgba(255,255,255,.05);
        }
        @media (max-width:960px){
            .shell{grid-template-columns:1fr}
            .mobile-controls{display:grid}
        }
        @media (max-width:720px){
            .hud{grid-template-columns:repeat(2,1fr)}
            .actions{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="panel stage">
            <div class="hud">
                <div class="stat"><span class="lab">Score</span><div class="val" id="score">0</div></div>
                <div class="stat"><span class="lab">Best</span><div class="val" id="best">0</div></div>
                <div class="stat"><span class="lab">Level</span><div class="val" id="level">1</div></div>
                <div class="stat"><span class="lab">Status</span><div class="val" id="stateText" style="font-size:18px;">Ready</div></div>
            </div>
            <canvas id="game" width="1280" height="720"></canvas>
            <div class="mobile-controls">
                <div class="stick" id="arcadeStick" aria-label="Virtual joystick">
                    <div class="knob" id="arcadeKnob"></div>
                </div>
                <div class="mobile-actions">
                    <button class="btn pri" id="actionBtn">Action</button>
                    <button class="btn ghost" id="altActionBtn">Alt</button>
                </div>
            </div>
        </section>

        <aside class="panel side">
            <div class="tag">{{ game.genre }} Mode</div>
            <h1>{{ game.title }}</h1>
            <p>{{ game.description }}</p>

            <div class="box">
                <strong>Qisqa qoida</strong>
                <p id="instructions">Yuklanmoqda...</p>
            </div>

            <div class="box">
                <strong>Holat</strong>
                <p id="message">Start bosing va o'yinni boshlang.</p>
            </div>

            <div class="actions">
                <button class="btn pri" id="restartBtn">Start / Restart</button>
                <a class="btn ghost" href="/">Asosiy sahifa</a>
                <a class="btn ghost" href="/game/">Nebula Rush</a>
                <a class="btn ghost" href="/game/tiles/">Flash Tiles</a>
            </div>
        </aside>
    </div>

    <script>
        const slug = "{{ game.slug }}";
        const title = "{{ game.title|escapejs }}";
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const levelEl = document.getElementById("level");
        const stateTextEl = document.getElementById("stateText");
        const messageEl = document.getElementById("message");
        const instructionsEl = document.getElementById("instructions");
        const restartBtn = document.getElementById("restartBtn");
        const actionBtn = document.getElementById("actionBtn");
        const altActionBtn = document.getElementById("altActionBtn");
        const arcadeStick = document.getElementById("arcadeStick");
        const arcadeKnob = document.getElementById("arcadeKnob");
        const pointer = {x: canvas.width / 2, y: canvas.height / 2, down: false};

        const rnd = (a, b) => Math.random() * (b - a) + a;
        const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
        const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
        const bestKey = `arcade-best-${slug}`;

        const state = {
            run: false,
            score: 0,
            best: Number(localStorage.getItem(bestKey) || 0),
            level: 1,
            status: "Ready",
            message: "",
            last: 0,
            time: 0,
            world: {},
            particles: [],
            keys: new Set(),
            touch: {dx: 0, dy: 0, active: false, laneCooldown: 0},
        };

        bestEl.textContent = state.best;

        function syncHud() {
            scoreEl.textContent = Math.floor(state.score);
            bestEl.textContent = state.best;
            levelEl.textContent = state.level;
            stateTextEl.textContent = state.status;
            messageEl.textContent = state.message;
        }

        function setStatus(status, message) {
            state.status = status;
            state.message = message;
            syncHud();
        }

        function saveBest() {
            if (state.score > state.best) {
                state.best = Math.floor(state.score);
                localStorage.setItem(bestKey, String(state.best));
            }
        }

        function endGame(message) {
            state.run = false;
            saveBest();
            setStatus("Game Over", message || `Natija: ${Math.floor(state.score)}. Restart bilan qayta boshlang.`);
        }

        function burst(x, y, color, count = 16) {
            for (let i = 0; i < count; i += 1) {
                const angle = rnd(0, Math.PI * 2);
                const speed = rnd(40, 200);
                state.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: rnd(0.35, 0.9),
                    size: rnd(2, 6),
                    color,
                });
            }
        }

        function drawBackdrop(accentA, accentB) {
            const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
            g.addColorStop(0, "#07111d");
            g.addColorStop(0.55, accentA);
            g.addColorStop(1, "#02060c");
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = accentB;
            ctx.beginPath();
            ctx.arc(canvas.width * 0.18, canvas.height * 0.18, 140, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(canvas.width * 0.84, canvas.height * 0.14, 110, 0, Math.PI * 2);
            ctx.fill();
            for (let i = 0; i < 40; i += 1) {
                ctx.fillStyle = `rgba(255,255,255,${0.05 + (i % 3) * 0.03})`;
                ctx.fillRect((i * 97) % canvas.width, (i * 53 + state.time * 12) % canvas.height, 2, 2);
            }
        }

        function drawParticles(dt) {
            for (let i = state.particles.length - 1; i >= 0; i -= 1) {
                const p = state.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) {
                    state.particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function setVirtualKey(code, active) {
            if (active) state.keys.add(code);
            else state.keys.delete(code);
        }

        function clearVirtualKeys() {
            ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "KeyC"].forEach((code) => state.keys.delete(code));
        }

        const games = {
            "prism-drift": {
                instructions: "Sichqoncha bilan hovercraftni yuring. Kelayotgan prismalarga tegmang.",
                init() {
                    state.world = {ship: {x: 180, y: 300, r: 18}, prisms: [], spawn: 0, glow: 0};
                    state.score = 0;
                    state.level = 1;
                },
                update(dt) {
                    const w = state.world;
                    w.ship.x += (pointer.x - w.ship.x) * Math.min(1, dt * 7);
                    w.ship.y += (pointer.y - w.ship.y) * Math.min(1, dt * 7);
                    w.spawn -= dt;
                    if (w.spawn <= 0) {
                        w.prisms.push({x: canvas.width + 40, y: rnd(70, canvas.height - 70), r: rnd(18, 34), speed: rnd(280, 460)});
                        w.spawn = Math.max(0.18, 0.55 - state.score * 0.005);
                    }
                    for (let i = w.prisms.length - 1; i >= 0; i -= 1) {
                        const p = w.prisms[i];
                        p.x -= p.speed * dt;
                        if (dist(p.x, p.y, w.ship.x, w.ship.y) < p.r + w.ship.r) {
                            burst(w.ship.x, w.ship.y, "#7cf6ff", 22);
                            endGame("Prismaga tegdingiz.");
                            return;
                        }
                        if (p.x < -60) {
                            w.prisms.splice(i, 1);
                            state.score += 2;
                        }
                    }
                    state.score += dt * 8;
                    state.level = 1 + Math.floor(state.score / 30);
                    setStatus("Live", "Prismalar zichlashmoqda.");
                },
                draw() {
                    drawBackdrop("#0f2239", "rgba(124,246,255,.16)");
                    const w = state.world;
                    for (const p of w.prisms) {
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(state.time * 2);
                        ctx.fillStyle = "#7cf6ff";
                        ctx.beginPath();
                        for (let i = 0; i < 6; i += 1) {
                            const a = i * Math.PI / 3;
                            const rr = i % 2 === 0 ? p.r : p.r * 0.45;
                            const x = Math.cos(a) * rr;
                            const y = Math.sin(a) * rr;
                            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(w.ship.x, w.ship.y, w.ship.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#7cf6ff";
                    ctx.beginPath();
                    ctx.arc(w.ship.x + 5, w.ship.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                },
            },
            "meteor-pop": {
                instructions: "Meteorlarni bosing. Juda ko'p obyekt portlab ketishiga yo'l qo'ymang.",
                init() {
                    state.world = {meteors: [], spawn: 0, energy: 100};
                    state.score = 0;
                    state.level = 1;
                },
                update(dt) {
                    const w = state.world;
                    w.spawn -= dt;
                    if (w.spawn <= 0) {
                        w.meteors.push({x: rnd(90, canvas.width - 90), y: rnd(80, canvas.height - 80), r: rnd(20, 38), life: rnd(1.2, 2.4)});
                        w.spawn = Math.max(0.18, 0.58 - state.score * 0.004);
                    }
                    for (let i = w.meteors.length - 1; i >= 0; i -= 1) {
                        const m = w.meteors[i];
                        m.life -= dt;
                        if (m.life <= 0) {
                            burst(m.x, m.y, "#ff5d73", 20);
                            w.meteors.splice(i, 1);
                            w.energy -= 18;
                        }
                    }
                    state.level = 1 + Math.floor(state.score / 12);
                    if (w.energy <= 0) {
                        endGame("Meteorlar juda ko'p portladi.");
                        return;
                    }
                    setStatus("Live", `Energiya: ${Math.max(0, Math.floor(w.energy))}`);
                },
                draw() {
                    drawBackdrop("#2a1010", "rgba(255,138,91,.16)");
                    const w = state.world;
                    for (const m of w.meteors) {
                        ctx.fillStyle = "#ff8a5b";
                        ctx.beginPath();
                        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#fff3d1";
                        ctx.fillRect(m.x - 18, m.y - 2, 36 * (m.life / 2.4), 4);
                    }
                    ctx.fillStyle = "rgba(255,255,255,.08)";
                    ctx.fillRect(30, 28, 180, 12);
                    ctx.fillStyle = "#7dffb5";
                    ctx.fillRect(30, 28, 180 * (w.energy / 100), 12);
                },
                pointerDown() {
                    const w = state.world;
                    for (let i = w.meteors.length - 1; i >= 0; i -= 1) {
                        const m = w.meteors[i];
                        if (dist(pointer.x, pointer.y, m.x, m.y) <= m.r) {
                            state.score += 3;
                            burst(m.x, m.y, "#ffcf6d", 16);
                            w.meteors.splice(i, 1);
                            return;
                        }
                    }
                },
            },
            "ring-rescue": {
                instructions: "Orbni sichqoncha bilan sudrang. Oltin halqalarni oling, qizil maydonlardan qoching.",
                init() {
                    state.world = {orb: {x: 480, y: 300, r: 16}, rings: [], hazards: [], spawn: 0, hurt: 100};
                    state.score = 0;
                    state.level = 1;
                },
                update(dt) {
                    const w = state.world;
                    w.orb.x += (pointer.x - w.orb.x) * Math.min(1, dt * 5);
                    w.orb.y += (pointer.y - w.orb.y) * Math.min(1, dt * 5);
                    w.spawn -= dt;
                    if (w.spawn <= 0) {
                        w.rings.push({x: rnd(120, canvas.width - 120), y: rnd(80, canvas.height - 80), r: 14});
                        w.hazards.push({x: rnd(120, canvas.width - 120), y: rnd(80, canvas.height - 80), r: rnd(22, 34), pulse: rnd(0, 6)});
                        w.spawn = 1.4;
                    }
                    for (let i = w.rings.length - 1; i >= 0; i -= 1) {
                        const ring = w.rings[i];
                        if (dist(ring.x, ring.y, w.orb.x, w.orb.y) < ring.r + w.orb.r) {
                            state.score += 4;
                            burst(ring.x, ring.y, "#ffe27a", 12);
                            w.rings.splice(i, 1);
                        }
                    }
                    for (const hazard of w.hazards) {
                        hazard.pulse += dt * 2;
                        if (dist(hazard.x, hazard.y, w.orb.x, w.orb.y) < hazard.r + w.orb.r - 6) {
                            w.hurt -= 24 * dt;
                        }
                    }
                    state.level = 1 + Math.floor(state.score / 20);
                    if (w.hurt <= 0) {
                        endGame("Qizil zona yadroga zarar yetkazdi.");
                        return;
                    }
                    setStatus("Live", "Halqalarni zudlik bilan yig'ing.");
                },
                draw() {
                    drawBackdrop("#102238", "rgba(255,226,122,.15)");
                    const w = state.world;
                    for (const ring of w.rings) {
                        ctx.strokeStyle = "#ffe27a";
                        ctx.lineWidth = 6;
                        ctx.beginPath();
                        ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    for (const hazard of w.hazards) {
                        ctx.fillStyle = `rgba(255,93,115,${0.14 + Math.sin(hazard.pulse) * 0.08})`;
                        ctx.beginPath();
                        ctx.arc(hazard.x, hazard.y, hazard.r + Math.sin(hazard.pulse) * 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(w.orb.x, w.orb.y, w.orb.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#8df7ff";
                    ctx.beginPath();
                    ctx.arc(w.orb.x, w.orb.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                },
            },
            "gravity-well": {
                instructions: "WASD bilan zondni boshqaring. Markazga qulab tushmang va chiqindilardan qoching.",
                init() {
                    state.world = {ship: {x: 740, y: 220, vx: 0, vy: 100, r: 12}, debris: [], spawn: 0};
                    state.score = 0;
                    state.level = 1;
                },
                update(dt) {
                    const w = state.world;
                    const s = w.ship;
                    const dx = canvas.width / 2 - s.x;
                    const dy = canvas.height / 2 - s.y;
                    const d = Math.max(60, Math.hypot(dx, dy));
                    s.vx += (dx / d) * 140 * dt;
                    s.vy += (dy / d) * 140 * dt;
                    if (state.keys.has("KeyW")) s.vy -= 220 * dt;
                    if (state.keys.has("KeyS")) s.vy += 220 * dt;
                    if (state.keys.has("KeyA")) s.vx -= 220 * dt;
                    if (state.keys.has("KeyD")) s.vx += 220 * dt;
                    s.x += s.vx * dt;
                    s.y += s.vy * dt;
                    w.spawn -= dt;
                    if (w.spawn <= 0) {
                        const edge = Math.floor(rnd(0, 4));
                        const pos = [[-30, rnd(0, 600)], [990, rnd(0, 600)], [rnd(0, 960), -30], [rnd(0, 960), 630]][edge];
                        w.debris.push({x: pos[0], y: pos[1], vx: rnd(-80, 80), vy: rnd(-80, 80), r: rnd(12, 24)});
                        w.spawn = 0.45;
                    }
                    if (dist(s.x, s.y, canvas.width / 2, canvas.height / 2) < 54) {
                        endGame("Zond markaziy quduqqa qulab tushdi.");
                        return;
                    }
                    if (s.x < -50 || s.x > canvas.width + 50 || s.y < -50 || s.y > canvas.height + 50) {
                        endGame("Orbital maydondan chiqib ketdingiz.");
                        return;
                    }
                    for (let i = w.debris.length - 1; i >= 0; i -= 1) {
                        const dbr = w.debris[i];
                        dbr.x += dbr.vx * dt;
                        dbr.y += dbr.vy * dt;
                        if (dist(dbr.x, dbr.y, s.x, s.y) < dbr.r + s.r) {
                            burst(s.x, s.y, "#8b7cff", 20);
                            endGame("Chiqindi bilan to'qnashuv.");
                            return;
                        }
                        if (dbr.x < -90 || dbr.x > 1050 || dbr.y < -90 || dbr.y > 690) w.debris.splice(i, 1);
                    }
                    state.score += dt * 10;
                    state.level = 1 + Math.floor(state.score / 25);
                    setStatus("Live", "Gravitatsiya kuchayib bormoqda.");
                },
                draw() {
                    drawBackdrop("#0b1730", "rgba(139,124,255,.18)");
                    const w = state.world;
                    ctx.fillStyle = "rgba(139,124,255,.3)";
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, canvas.height / 2, 58, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "rgba(255,255,255,.1)";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, canvas.height / 2, 140, 0, Math.PI * 2);
                    ctx.stroke();
                    for (const dbr of w.debris) {
                        ctx.fillStyle = "#8b7cff";
                        ctx.beginPath();
                        ctx.arc(dbr.x, dbr.y, dbr.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(w.ship.x, w.ship.y, w.ship.r, 0, Math.PI * 2);
                    ctx.fill();
                },
            },
            "tower-balance": {
                instructions: "Klik bilan blokni tushiring. Ustma-ust tushirish qanchalik to'g'ri bo'lsa, tower shuncha uzun bo'ladi.",
                init() {
                    state.world = {stack: [{x: 480, y: 560, w: 220, h: 28}], mover: {x: 160, y: 520, w: 200, h: 26, dir: 1}, dropping: false, vy: 0};
                    state.score = 0;
                    state.level = 1;
                },
                update(dt) {
                    const w = state.world;
                    const m = w.mover;
                    if (!w.dropping) {
                        m.x += 240 * dt * m.dir;
                        if (m.x < 110 || m.x > 850) m.dir *= -1;
                    } else {
                        m.y += w.vy * dt;
                        w.vy += 920 * dt;
                        const top = w.stack[w.stack.length - 1];
                        if (m.y + m.h / 2 >= top.y - top.h / 2) {
                            const overlap = Math.min(m.x + m.w / 2, top.x + top.w / 2) - Math.max(m.x - m.w / 2, top.x - top.w / 2);
                            if (overlap < 42) {
                                endGame(`Tower ${state.score} qavatda yiqildi.`);
                                return;
                            }
                            const nextY = top.y - top.h;
                            w.stack.push({x: (m.x + top.x) / 2, y: nextY, w: overlap, h: m.h});
                            state.score += 1;
                            state.level = 1 + state.score;
                            burst(m.x, nextY, "#7dffb5", 12);
                            w.mover = {x: 160, y: nextY - 40, w: overlap, h: 26, dir: state.score % 2 ? 1 : -1};
                            w.dropping = false;
                            w.vy = 0;
                            setStatus("Stacked", "Yangi blok tayyor.");
                        }
                    }

                draw() {
                    drawBackdrop("#11283a", "rgba(125,255,181,.15)");

                    for (const block of w.stack) {
                        ctx.fillStyle = "#7dffb5";
                        ctx.fillRect(block.x - block.w / 2, block.y - block.h / 2, block.w, block.h);
                    }
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(w.mover.x - w.mover.w / 2, w.mover.y - w.mover.h / 2, w.mover.w, w.mover.h);
                },
                pointerDown() {
                    if (!state.world.dropping) {
                        state.world.dropping = true;
                        state.world.vy = 80;
                    }
                },
            },
            "color-rush": {

            "drift-breaker": {
                instructions: "Paddleni sichqoncha bilan siljiting. To'pni tushirib yubormang va barcha neon bloklarni sindiring.",

                    const bricks = [];

                            bricks.push({x: 90 + col * 98, y: 70 + row * 38, w: 78, h: 22, hp: 1, color: ["#59d7ff", "#7dffb5", "#ffd36e", "#ff8a5b", "#c4b5fd"][row]});
                        }
                    }
                    state.world = {paddle: {x: 480, y: 548, w: 150, h: 18}, ball: {x: 480, y: 420, vx: 260, vy: -260, r: 10}, bricks};

                    state.level = 1;
                },
                update(dt) {
                    const w = state.world;
                    w.paddle.x += (pointer.x - w.paddle.x) * Math.min(1, dt * 10);
                    const b = w.ball;
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;
                    if (b.x < b.r || b.x > canvas.width - b.r) b.vx *= -1;
                    if (b.y < b.r) b.vy *= -1;
                    if (b.y > canvas.height + 30) {
                        endGame("To'pni tushirib yubordingiz.");
                        return;
                    }
                    const padHit = b.y + b.r > w.paddle.y - 10 && b.x > w.paddle.x - w.paddle.w / 2 && b.x < w.paddle.x + w.paddle.w / 2 && b.vy > 0;
                    if (padHit) {
                        b.vy = -Math.abs(b.vy);
                        b.vx = (b.x - w.paddle.x) * 3.2;
                    }
                    for (let i = w.bricks.length - 1; i >= 0; i -= 1) {
                        const br = w.bricks[i];
                        if (b.x > br.x && b.x < br.x + br.w && b.y - b.r < br.y + br.h && b.y + b.r > br.y) {
                            b.vy *= -1;
                            w.bricks.splice(i, 1);
                            state.score += 2;
                            burst(br.x + br.w / 2, br.y + br.h / 2, br.color, 10);

                    if (!w.bricks.length) {
                        state.score += 25;
                        endGame("Maydon tozalandi. Zo'r.");

                        ctx.fillStyle = br.color;
                        ctx.fillRect(br.x, br.y, br.w, br.h);
                    }
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(w.paddle.x - w.paddle.w / 2, w.paddle.y, w.paddle.w, w.paddle.h);
                    ctx.beginPath();
                    ctx.arc(w.ball.x, w.ball.y, w.ball.r, 0, Math.PI * 2);
                    ctx.fill();
                },
            },
            "shadow-step": {

            "crystal-harvest": {

                    if (state.keys.has("ArrowDown") || state.keys.has("KeyS")) p.y += speed * dt;
                    if (state.keys.has("ArrowLeft") || state.keys.has("KeyA")) p.x -= speed * dt;

                        ctx.moveTo(crystal.x, crystal.y - crystal.r);
                        ctx.lineTo(crystal.x + crystal.r * 0.7, crystal.y);

                        ctx.lineTo(crystal.x - crystal.r * 0.7, crystal.y);
                        ctx.closePath();
                        ctx.fill();
                    }
                    for (const mine of w.mines) {

            },
            "arc-blaster": {

                        w.angle += dt * w.speed;
                        w.player.x = w.anchor.x + Math.cos(w.angle) * 170;
                        w.player.y = w.anchor.y + Math.sin(w.angle) * 170;
                    } else {
                        w.player.vy += 820 * dt;
                        w.player.x += w.player.vx * dt;
                        w.player.y += w.player.vy * dt;
                        if (w.player.y > w.platform.y - 16 && w.player.y < w.platform.y + 30 && w.player.x > w.platform.x - w.platform.w / 2 && w.player.x < w.platform.x + w.platform.w / 2) {
                            state.score += 5;
                            state.level += 1;
                            burst(w.player.x, w.player.y, "#82f7ff", 14);
                            w.anchor = {x: w.platform.x, y: w.platform.y - 220};
                            w.platform = {x: rnd(240, 820), y: rnd(280, 470), w: clamp(180 - state.level * 8, 90, 180), h: 18};
                            w.angle = rnd(0.8, 1.4);
                            w.speed = Math.min(3.3, w.speed + 0.14);
                            w.released = false;
                        }
                        if (w.player.y > 700 || w.player.x < -80 || w.player.x > 1040) {
                            endGame("Platformaga qo'na olmadingiz.");
                        }
                    }
                    setStatus("Live", "Release timing hal qiluvchi.");
                },
                draw() {
                    drawBackdrop("#0a1b24", "rgba(130,247,255,.15)");
                    const w = state.world;
                    ctx.strokeStyle = "rgba(255,255,255,.22)";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(w.anchor.x, w.anchor.y);
                    ctx.lineTo(w.player.x, w.player.y);
                    ctx.stroke();
                    ctx.fillStyle = "#82f7ff";
                    ctx.fillRect(w.platform.x - w.platform.w / 2, w.platform.y, w.platform.w, w.platform.h);
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(w.player.x, w.player.y, 14, 0, Math.PI * 2);
                    ctx.fill();
                },
                pointerDown() {
                    const w = state.world;
                    if (!w.released) {
                        w.released = true;
                        w.player.vx = -Math.sin(w.angle) * 320;
                        w.player.vy = Math.cos(w.angle) * 320;
                    }
                },
            },
        };

        const currentGame = games[slug];

        if (!currentGame) {
            instructionsEl.textContent = "Bu o'yin topilmadi.";
            setStatus("Error", "Noto'g'ri route yoki slug.");
            throw new Error(`Unknown game slug: ${slug}`);
        }

        function restart() {
            state.run = true;
            state.last = 0;
            state.time = 0;
            state.particles = [];
            state.touch = {dx: 0, dy: 0, active: false, laneCooldown: 0};
            clearVirtualKeys();
            currentGame.init();
            instructionsEl.textContent = currentGame.instructions;
            setStatus("Live", `${title} boshlandi.`);
            syncHud();
            syncMobileHud();
            requestAnimationFrame(loop);
        }

        function loop(t) {
            if (!state.run) {
                drawFrame(0);
                return;
            }
            const dt = Math.min(0.033, (t - (state.last || t)) / 1000);
            state.last = t;
            state.time += dt;
            if (state.touch.laneCooldown > 0) state.touch.laneCooldown = Math.max(0, state.touch.laneCooldown - dt);
            if (currentGame.virtualStick) currentGame.virtualStick(dt);
            currentGame.update(dt);
            drawFrame(dt);
            syncHud();
            syncMobileHud();
            if (state.run) requestAnimationFrame(loop);
        }

        function drawFrame(dt) {
            currentGame.draw();
            drawParticles(dt);
        }

        function canvasPoint(event) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = (event.clientX - rect.left) * (canvas.width / rect.width);
            pointer.y = (event.clientY - rect.top) * (canvas.height / rect.height);
        }

        function syncMobileHud() {
            const mobileMap = {
                "gravity-well": {action: "Start", alt: "Brake"},
                "color-rush": {action: "Start", alt: "Color"},
                "crystal-harvest": {action: "Start", alt: "Hold"},
                "arc-blaster": {action: "Shoot", alt: "Aim"},
                "nova-jump": {action: "Jump", alt: "Restart"},
                "zen-pulse": {action: pointer.down ? "Release" : "Charge", alt: "Restart"},
                "tower-balance": {action: "Drop", alt: "Restart"},
                "sky-hook": {action: "Release", alt: "Restart"},
                "meteor-pop": {action: "Tap", alt: "Restart"},
                "aurora-link": {action: "Select", alt: "Restart"},
            };
            const labels = mobileMap[slug] || {action: "Action", alt: "Restart"};
            actionBtn.textContent = labels.action;
            altActionBtn.textContent = labels.alt;
        }

        function updateStick(clientX, clientY) {
            const rect = arcadeStick.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = clientX - cx;
            const dy = clientY - cy;
            const radius = rect.width * 0.3;
            const magnitude = Math.hypot(dx, dy) || 1;
            const limited = Math.min(radius, magnitude);
            const nx = dx / magnitude;
            const ny = dy / magnitude;
            arcadeKnob.style.transform = `translate(calc(-50% + ${nx * limited}px), calc(-50% + ${ny * limited}px))`;
            state.touch.dx = limited ? nx * (limited / radius) : 0;
            state.touch.dy = limited ? ny * (limited / radius) : 0;
            state.touch.active = true;
            setVirtualKey("KeyA", state.touch.dx < -0.35);
            setVirtualKey("ArrowLeft", state.touch.dx < -0.35);
            setVirtualKey("KeyD", state.touch.dx > 0.35);
            setVirtualKey("ArrowRight", state.touch.dx > 0.35);
            setVirtualKey("KeyW", state.touch.dy < -0.35);
            setVirtualKey("ArrowUp", state.touch.dy < -0.35);
            setVirtualKey("KeyS", state.touch.dy > 0.35);
            setVirtualKey("ArrowDown", state.touch.dy > 0.35);
        }

        function resetStick() {
            state.touch.dx = 0;
            state.touch.dy = 0;
            state.touch.active = false;
            arcadeKnob.style.transform = "translate(-50%,-50%)";
            ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].forEach((code) => state.keys.delete(code));
        }

        function triggerAction() {
            if (!state.run) {
                restart();
                return;
            }
            if (currentGame.pointerDown) {
                pointer.down = true;
                currentGame.pointerDown();
            } else if (currentGame.keyDown) {
                currentGame.keyDown("Space");
            }
        }

        function releaseAction() {
            pointer.down = false;
            if (currentGame.pointerUp) currentGame.pointerUp();
        }

        function triggerAltAction() {
            if (!state.run) {
                restart();
                return;
            }
            if (currentGame.altAction) currentGame.altAction();
            else if (slug === "arc-blaster") currentGame.keyDown("Space");
            else if (slug === "color-rush") currentGame.keyDown("KeyC");
            else if (slug === "zen-pulse") {
                if (pointer.down) releaseAction();
                else triggerAction();
            }
        }

        canvas.addEventListener("mousemove", (event) => {
            canvasPoint(event);
            if (currentGame.pointerMove) currentGame.pointerMove();
        });
        canvas.addEventListener("mousedown", (event) => {
            canvasPoint(event);
            pointer.down = true;
            if (!state.run) {
                restart();
                return;
            }
            if (currentGame.pointerDown) currentGame.pointerDown();
        });
        window.addEventListener("mouseup", () => {
            pointer.down = false;
            if (currentGame.pointerUp) currentGame.pointerUp();
        });
        canvas.addEventListener("touchstart", (event) => {
            const touch = event.touches[0];
            canvasPoint(touch);
            pointer.down = true;
            event.preventDefault();
            if (!state.run) {
                restart();
                return;
            }
            if (currentGame.pointerDown) currentGame.pointerDown();
        }, {passive: false});
        canvas.addEventListener("touchmove", (event) => {
            const touch = event.touches[0];
            canvasPoint(touch);
            event.preventDefault();
        }, {passive: false});
        window.addEventListener("touchend", () => {
            pointer.down = false;
            if (currentGame.pointerUp) currentGame.pointerUp();
        });
        window.addEventListener("keydown", (event) => {
            state.keys.add(event.code);
            if (!state.run && event.code === "Space") {
                event.preventDefault();
                restart();
                return;
            }
            if (currentGame.keyDown) currentGame.keyDown(event.code);
        });
        window.addEventListener("keyup", (event) => {
            state.keys.delete(event.code);
            if (slug === "zen-pulse" && event.code === "Space" && currentGame.pointerUp) currentGame.pointerUp();
        });
        restartBtn.addEventListener("click", restart);
        actionBtn.addEventListener("pointerdown", triggerAction);
        actionBtn.addEventListener("pointerup", releaseAction);
        actionBtn.addEventListener("pointercancel", releaseAction);
        altActionBtn.addEventListener("click", triggerAltAction);
        arcadeStick.addEventListener("pointerdown", (event) => {
            arcadeStick.setPointerCapture(event.pointerId);
            updateStick(event.clientX, event.clientY);
        });
        arcadeStick.addEventListener("pointermove", (event) => {
            if (event.buttons !== 0 || state.touch.active) updateStick(event.clientX, event.clientY);
        });
        arcadeStick.addEventListener("pointerup", resetStick);
        arcadeStick.addEventListener("pointercancel", resetStick);

        instructionsEl.textContent = currentGame.instructions;
        setStatus("Ready", "Start bosing yoki canvas ustiga bosib o'yinni boshlang.");
        currentGame.init();
        drawFrame(0.016);
        syncHud();
        syncMobileHud();
    </script>
</body>
</html>
